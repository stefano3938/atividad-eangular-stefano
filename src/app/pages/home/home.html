<!-- Main Wrapper -->
<div class="home-wrapper">
  
  <!-- Topbar -->
  <div class="topbar p-3 d-flex justify-content-between align-items-center">
    <button class="btn btn-link text-success p-0" (click)="toggleSidebar()">
      <i class="bi bi-list fs-3"></i>
    </button>
    
    <button class="btn btn-light rounded-circle shadow-sm" (click)="logout()" title="Logout">
      <i class="bi bi-person text-success"></i>
    </button>
  </div>

  <!-- Sidebar -->
  <div class="sidebar bg-light shadow" [class.open]="isSidebarOpen">
    <div class="text-center py-4">
      <img src="img/ford.png" alt="Ford" width="100">
    </div>
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link text-success fw-bold bg-white border-start border-4 border-danger py-3" routerLink="/home">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-success fw-bold py-3" routerLink="/dashboard">Dashboard</a>
      </li>
    </ul>
  </div>

  <!-- Content / Welcome Card -->
  <div class="content-container d-flex justify-content-center align-items-center h-100">
    <div class="welcome-card card shadow">
      <div class="card-header bg-light text-secondary border-0">
        Sistema de dados FORD
      </div>
      <div class="card-body bg-transparent">
        <h5 class="text-info m-0 p-4">Seja bem vindo(a)!</h5>
      </div>
    </div>
  </div>

</div>
