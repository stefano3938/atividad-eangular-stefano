<div class="container-fluid vh-100 p-0 m-0 overflow-hidden">
  <div class="row h-100 m-0">
    <!-- Imagem da Esquerda -->
    <div class="col-md-6 p-0 d-none d-md-flex align-items-center justify-content-center">
      <img src="img/ranger.png" alt="Ranger" class="img-fluid">
    </div>
    
    <!-- Lado Direito (Formulário) -->
    <div class="col-md-6 d-flex flex-column align-items-center justify-content-center">
      <div class="login-form-container text-center w-100" style="max-width: 400px;">
        
        <img src="img/ford.png" alt="Ford Logo" class="mb-5" style="width: 200px;">
        
        <h4 class="mb-4 text-success fw-normal">Boas-vindas</h4>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
          
          <div class="mb-3">
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" placeholder="Insira seu usuário" [(ngModel)]="nome" name="nome" required>
            </div>
          </div>

          <div class="mb-3">
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" placeholder="Insira sua senha" [(ngModel)]="senha" name="senha" required>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4 text-muted">
            <label class="form-check-label small" for="autoLogin">Logar automaticamente</label>
            <div class="form-check form-switch m-0">
              <input class="form-check-input" type="checkbox" id="autoLogin">
            </div>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger p-2 small">
            {{ errorMessage }}
          </div>

          <button type="submit" class="btn btn-secondary w-100 border-0 text-white fw-bold" style="background-color: #bdc3c7;">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
